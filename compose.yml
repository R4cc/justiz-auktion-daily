services:
  justizguessr:
    image: ${DOCKERHUB_USERNAME}/justizguessr:${JUSTIZGUESSR_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    tmpfs:
      - /tmp:size=16m,mode=1777,nosuid,nodev,noexec
    volumes:
      - justizguessr-data:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - tunnel
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    user: "65532:65532"
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 128m
    tmpfs:
      - /tmp:size=16m,mode=1777,nosuid,nodev,noexec
    depends_on:
      justizguessr:
        condition: service_healthy
    networks:
      - tunnel
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  tunnel:
    driver: bridge

volumes:
  justizguessr-data:
