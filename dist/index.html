<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f3e8" />
    <meta name="description" content="Five real auctions. Guess the price, collect the surprises." />
    <title>JUSTIZGUESSR — The daily auction game</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css?v=20260912-12" />
  </head>
  <body>
    <div class="paper-noise" aria-hidden="true"></div>
    <header class="site-header">
      <button class="wordmark" type="button" data-action="home" aria-label="Home">
        <span class="brand-symbol" aria-hidden="true">J<span>g.</span></span><span>JUSTIZGUESSR</span>

      <div class="header-actions">
        <span class="daily-reset"><span>NEXT DAILY IN</span><strong data-daily-reset>--:--:--</strong></span>
        <select id="language-select" aria-label="Language"><option value="en">English</option><option value="de">Deutsch</option></select>
        <button class="icon-button" type="button" data-action="help" aria-label="Game rules">?</button>
      </div>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="/" data-page>Play</a><a href="/inventory" data-page>Inventory</a><a href="/shop" data-page>Shop</a><a href="/profile" data-page>Profile</a><a href="/admin" data-page hidden>Admin</a>
      </nav>
      <a id="header-auth" class="account-button" href="/login" data-page>Log in / Register</a>
    </header>
    <main id="app" aria-live="polite"></main>
    <main id="account-page" class="account-page" hidden><div id="account-content"></div></main>
    <dialog id="help-dialog" class="help-dialog"></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/i18n.js?v=20260912-2" defer></script>
    <script src="/account.js?v=20260912-6" defer></script>
    <script src="/higher-lower.js?v=20260912-3" defer></script>
    <script src="/app.js?v=20260912-9" defer></script>
